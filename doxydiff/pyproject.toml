[project]
name = "doxydiff"
version = "0.1.0"
description = "Compare Doxygen documentation output between two versions of a software project"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
doxydiff = "doxydiff.cli:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doxydiff"]
